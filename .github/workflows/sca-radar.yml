name: SCA Radar

# Pilot caller of vitado/sca-radar on the fork: manual runs only.
# Inventory = the Trivy parts (native JSON per target) of the latest successful
# SCA Scan run of this fork, converted to CycloneDX; they expire after a day.

on:
  workflow_dispatch:

concurrency:
  group: sca-radar
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Trivy parts of the latest SCA Scan run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh run list -R "$REPO" --workflow sca-scan.yml --status success -L 1 \
            --json databaseId -q '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "::error::no successful SCA Scan run"
            exit 1
          fi
          echo "SCA Scan run: $run_id"
          gh run download "$run_id" -R "$REPO" -p 'sca-part-trivy-*' -D "$RUNNER_TEMP/parts"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.75.0
          cache: true
      - name: Convert to CycloneDX
        id: sbom
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          {
            echo 'list<<SBOMS'
            for dir in "$RUNNER_TEMP"/parts/sca-part-trivy-*; do
              target="${dir##*/sca-part-trivy-}"
              trivy convert --quiet --format cyclonedx \
                --output "$RUNNER_TEMP/sbom/$target.cdx.json" "$dir/trivy/$target.json"
              echo "$target=$RUNNER_TEMP/sbom/$target.cdx.json"
            done
            echo 'SBOMS'
          } >> "$GITHUB_OUTPUT"
      - name: Radar
        uses: vitado/sca-radar@ce6c26a3868edeae8034e7a1718b25add83c4e2b # main
        with:
          sboms: ${{ steps.sbom.outputs.list }}
          output-dir: ${{ runner.temp }}/radar
