name: SCA Scan

# Manual runs only (workflow_dispatch). Calls the engine wrapper in vitado/ai-dial-ci.

on:
  workflow_dispatch:
    inputs:
      scan-tag:
        description: "Focus the run on this one git tag (its source and the tag in every image) instead of the release set; empty = the full set"
        type: string
        default: ""
      force-image-scan:
        description: "On this one run, run the direct OSV image scan also where it is off for this repository"
        type: boolean
        default: false

run-name: >-
  SCA - manual by ${{ github.triggering_actor }}${{ inputs.scan-tag && format(' - tag {0}', inputs.scan-tag) || '' }}

concurrency:
  group: sca-scan
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  sca:
    uses: vitado/ai-dial-ci/.github/workflows/sca_scheduled.yml@sca-scheduled
    with:
      repository: epam/statgpt-sdmx-proxy
      java-version: "25"
      images: |
        epam/statgpt-sdmx-proxy
        epam/statgpt-sdmx-proxy-config-server
      scan-tag: ${{ inputs.scan-tag }}
      force-image-scan: ${{ inputs.force-image-scan || false }}
